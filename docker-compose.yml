services:
  build:
    build:
      context: .
      target: wasm-builder
    volumes:
      - ./pkg:/app/pkg
    command: npm run build:wasm:production

  build-dev:
    build:
      context: .
      target: wasm-builder
    volumes:
      - ./pkg:/app/pkg
    command: npm run build:wasm

  build-node:
    build:
      context: .
      target: wasm-builder
    volumes:
      - ./pkg-node:/app/pkg-node
    command: npm run build:wasm:node

  test:
    build:
      context: .
      target: test-runner
    volumes:
      - ./coverage:/app/coverage
      - ./coverage-rust:/app/coverage-rust

  test-rust:
    build:
      context: .
      target: test-runner
    command: npm run test:rust

  test-wasm:
    build:
      context: .
      target: test-runner
    command: npm run test:wasm:node

  test-jest:
    build:
      context: .
      target: test-runner
    command: npm run test:jest

  dev:
    build:
      context: .
      target: development
    ports:
      - "6006:6006"
    volumes:
      - ./src:/app/src
      - ./pkg:/app/pkg
    environment:
      - NODE_ENV=development

  serve:
    build:
      context: .
      target: production
    ports:
      - "8084:80"

  storybook:
    build:
      context: .
      target: development
    ports:
      - "6006:6006"
    volumes:
      - ./src:/app/src
      - ./pkg:/app/pkg
    command: npm start

  shell:
    build:
      context: .
      target: development
    volumes:
      - ./pkg:/app/pkg
      - ./src:/app/src
    command: /bin/bash
    stdin_open: true
    tty: true

  verification:
    build:
      context: .
      target: verification
    volumes:
      - ./formal-proofs:/app/formal-proofs
      - ./signal-protocol-core:/app/signal-protocol-core
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: cargo hax into fstar

  # Runs the full `npm run verify:host` chain (F* + Rocq + Lean) inside the
  # verification image. Used both by `npm run verify:docker` for local
  # fallback and by the `Verify` GitHub Actions workflow for CI.
  #
  # An explicit `image:` tag is pinned so CI can pre-build the image with
  # buildx + GHA cache and `docker compose run` picks it up by tag instead
  # of rebuilding. Locally, if the image does not exist, compose falls back
  # to building via the `build:` block below.
  verify-runner:
    image: signal-protocol-verify-runner:latest
    build:
      context: .
      target: verification
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: >
      bash -lc "
        if [ ! -d hax-upstream/hax-lib ]; then
          COMMIT=\"$(cat hax-upstream.commit | tr -d '[:space:]')\";
          echo \"Cloning hacspec/hax pinned to $COMMIT...\";
          git clone https://github.com/hacspec/hax.git hax-upstream;
          ( cd hax-upstream && git checkout --detach \"$COMMIT\" );
        fi;
        eval \"$(opam env)\";
        npm run verify:host
      "

  hax-fstar:
    build:
      context: .
      target: verification
    volumes:
      - ./formal-proofs:/app/formal-proofs
      - ./signal-protocol-core:/app/signal-protocol-core
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: cargo hax into fstar

  hax-coq:
    build:
      context: .
      target: verification
    volumes:
      - ./formal-proofs:/app/formal-proofs
      - ./signal-protocol-core:/app/signal-protocol-core
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: cargo hax into coq

  hax-lean:
    build:
      context: .
      target: verification
    volumes:
      - ./formal-proofs:/app/formal-proofs
      - ./signal-protocol-core:/app/signal-protocol-core
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: cargo hax into lean

  # NOTE: lean-verify targets the *experimental* Lean track. The Lean
  # backend is not part of the verified claim - see proofs/experimental/.
  lean-verify:
    build:
      context: .
      target: verification
    volumes:
      - ./signal-protocol-core:/app/signal-protocol-core
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    working_dir: /app/signal-protocol-core/proofs/experimental/lean
    command: lake build

  lean-shell:
    build:
      context: .
      target: verification
    volumes:
      - ./:/app
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: /bin/bash
    stdin_open: true
    tty: true

  proverif:
    build:
      context: .
      target: proverif
    volumes:
      - ./formal-proofs:/app/formal-proofs
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

  # The previous proverif-x3dh / proverif-double-ratchet sub-services
  # invoked broken model files (e.g. proverif/x3dh/x3dh_complete.pv)
  # that have been replaced by the new top-level x3dh.pv,
  # double_ratchet.pv, etc. Use the `proverif` service above to run
  # the full ProVerif suite via test_proverif.sh, or invoke a single
  # model directly:
  #   docker compose run --rm proverif proverif proverif/x3dh.pv

  proverif-x3dh:
    build:
      context: .
      target: proverif
    volumes:
      - ./formal-proofs:/app/formal-proofs
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: proverif proverif/x3dh.pv

  proverif-double-ratchet:
    build:
      context: .
      target: proverif
    volumes:
      - ./formal-proofs:/app/formal-proofs
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: proverif proverif/double_ratchet.pv

  formal-shell:
    build:
      context: .
      target: verification
    volumes:
      - ./:/app
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: /bin/bash
    stdin_open: true
    tty: true

  coq-shell:
    build:
      context: .
      target: verification
    volumes:
      - ./:/app
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: /bin/bash
    stdin_open: true
    tty: true

  # NOTE: coq-verify targets the *experimental* Rocq track. The Rocq
  # backend is not part of the verified claim - see proofs/experimental/.
  # The default target compiles only the hand-written AbstractCrypto.v.
  coq-verify:
    build:
      context: .
      target: verification
    volumes:
      - ./signal-protocol-core:/app/signal-protocol-core
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    working_dir: /app/signal-protocol-core/proofs/experimental/coq/extraction
    command: make verify-abstract
