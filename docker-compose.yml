services:
  build:
    build:
      context: .
      target: wasm-builder
    volumes:
      - ./pkg:/app/pkg
    command: npm run build:wasm:production

  build-dev:
    build:
      context: .
      target: wasm-builder
    volumes:
      - ./pkg:/app/pkg
    command: npm run build:wasm

  build-node:
    build:
      context: .
      target: wasm-builder
    volumes:
      - ./pkg-node:/app/pkg-node
    command: npm run build:wasm:node

  test:
    build:
      context: .
      target: test-runner
    volumes:
      - ./coverage:/app/coverage
      - ./coverage-rust:/app/coverage-rust

  test-rust:
    build:
      context: .
      target: test-runner
    command: npm run test:rust

  test-wasm:
    build:
      context: .
      target: test-runner
    command: npm run test:wasm:node

  test-jest:
    build:
      context: .
      target: test-runner
    command: npm run test:jest

  dev:
    build:
      context: .
      target: development
    ports:
      - "6006:6006"
    volumes:
      - ./src:/app/src
      - ./pkg:/app/pkg
    environment:
      - NODE_ENV=development

  serve:
    build:
      context: .
      target: production
    ports:
      - "8084:80"

  storybook:
    build:
      context: .
      target: development
    ports:
      - "6006:6006"
    volumes:
      - ./src:/app/src
      - ./pkg:/app/pkg
    command: npm start

  shell:
    build:
      context: .
      target: development
    volumes:
      - ./pkg:/app/pkg
      - ./src:/app/src
    command: /bin/bash
    stdin_open: true
    tty: true

  verification:
    build:
      context: .
      target: verification
    volumes:
      - ./formal-proofs:/app/formal-proofs
      - ./signal-protocol-core:/app/signal-protocol-core
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: cargo hax into fstar

  # Runs the full `npm run verify:host` chain (F* + Rocq + Lean) inside the
  # verification image. Used both by `npm run verify:docker` for local
  # fallback and by the `Verify` GitHub Actions workflow for CI.
  #
  # An explicit `image:` tag is pinned so CI can pre-build the image with
  # buildx + GHA cache and `docker compose run` picks it up by tag instead
  # of rebuilding. Locally, if the image does not exist, compose falls back
  # to building via the `build:` block below.
  verify-runner:
    image: signal-protocol-verify-runner:latest
    build:
      context: .
      target: verification
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: >
      bash -lc "
        if [ ! -d hax-upstream/hax-lib ]; then
          echo 'Cloning hax-upstream (hacspec/hax) for proof libraries...';
          git clone --depth=1 https://github.com/hacspec/hax.git hax-upstream;
        fi;
        eval \"$(opam env)\";
        npm run verify:host
      "

  hax-fstar:
    build:
      context: .
      target: verification
    volumes:
      - ./formal-proofs:/app/formal-proofs
      - ./signal-protocol-core:/app/signal-protocol-core
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: cargo hax into fstar

  hax-coq:
    build:
      context: .
      target: verification
    volumes:
      - ./formal-proofs:/app/formal-proofs
      - ./signal-protocol-core:/app/signal-protocol-core
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: cargo hax into coq

  hax-lean:
    build:
      context: .
      target: verification
    volumes:
      - ./formal-proofs:/app/formal-proofs
      - ./signal-protocol-core:/app/signal-protocol-core
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: cargo hax into lean

  lean-verify:
    build:
      context: .
      target: verification
    volumes:
      - ./signal-protocol-core:/app/signal-protocol-core
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    working_dir: /app/signal-protocol-core/proofs/lean
    command: lake build

  lean-shell:
    build:
      context: .
      target: verification
    volumes:
      - ./:/app
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: /bin/bash
    stdin_open: true
    tty: true

  proverif:
    build:
      context: .
      target: proverif
    volumes:
      - ./formal-proofs:/app/formal-proofs
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

  proverif-x3dh:
    build:
      context: .
      target: proverif
    volumes:
      - ./formal-proofs:/app/formal-proofs
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: proverif proverif/x3dh/x3dh_complete.pv

  proverif-double-ratchet:
    build:
      context: .
      target: proverif
    volumes:
      - ./formal-proofs:/app/formal-proofs
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: proverif proverif/double_ratchet/double_ratchet_security.pv

  formal-shell:
    build:
      context: .
      target: verification
    volumes:
      - ./:/app
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: /bin/bash
    stdin_open: true
    tty: true

  coq-shell:
    build:
      context: .
      target: verification
    volumes:
      - ./:/app
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: /bin/bash
    stdin_open: true
    tty: true

  coq-verify:
    build:
      context: .
      target: verification
    volumes:
      - ./signal-protocol-core:/app/signal-protocol-core
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    working_dir: /app/signal-protocol-core/proofs/coq/extraction
    command: make verify

  # ============================================
  # Aeneas verification services
  # ============================================

  aeneas-fstar:
    build:
      context: .
      target: aeneas-verification
    volumes:
      - ./signal-protocol-core:/app/signal-protocol-core
      - ./aeneas-upstream:/app/aeneas-upstream
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: bash -lc "cd signal-protocol-core && charon cargo --preset=aeneas && aeneas -backend fstar signal_protocol_core.llbc"

  aeneas-coq:
    build:
      context: .
      target: aeneas-verification
    volumes:
      - ./signal-protocol-core:/app/signal-protocol-core
      - ./aeneas-upstream:/app/aeneas-upstream
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: bash -lc "cd signal-protocol-core && charon cargo --preset=aeneas && aeneas -backend coq signal_protocol_core.llbc"

  aeneas-lean:
    build:
      context: .
      target: aeneas-verification
    volumes:
      - ./signal-protocol-core:/app/signal-protocol-core
      - ./aeneas-upstream:/app/aeneas-upstream
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: bash -lc "cd signal-protocol-core && charon cargo --preset=aeneas && aeneas -backend lean signal_protocol_core.llbc"

  aeneas-verify-runner:
    image: signal-protocol-aeneas-verify-runner:latest
    build:
      context: .
      target: aeneas-verification
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: >
      bash -lc "
        if [ ! -d aeneas-upstream/backends ]; then
          echo 'Cloning aeneas-upstream (AeneasVerif/aeneas) for proof libraries...';
          git clone --depth=1 https://github.com/AeneasVerif/aeneas.git aeneas-upstream;
        fi;
        eval \"$(opam env)\";
        npm run verify:aeneas:host
      "

  aeneas-lean-verify:
    build:
      context: .
      target: aeneas-verification
    volumes:
      - ./signal-protocol-core:/app/signal-protocol-core
      - ./aeneas-upstream:/app/aeneas-upstream
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    working_dir: /app/signal-protocol-core/proofs-aeneas/lean
    command: lake build

  aeneas-shell:
    build:
      context: .
      target: aeneas-verification
    volumes:
      - ./:/app
    environment:
      - PATH=/root/.opam/5.1.1/bin:/root/.cargo/bin:/root/.elan/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: /bin/bash
    stdin_open: true
    tty: true
