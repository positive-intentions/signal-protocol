name: Test WASM (Node)

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: test-wasm-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: WASM tests (Node runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Covers two Node-side WASM test paths:
      #   - test:wasm:wrappers: builds pkg-node and runs test-wasm-standalone.mjs
      #   - test:wasm:node:     `wasm-pack test --node`
      - name: Run WASM wrapper smoke test
        run: npm run test:wasm:wrappers

      - name: Run wasm-pack Node tests
        run: npm run test:wasm:node
