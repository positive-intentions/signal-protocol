name: Verify F*

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: verify-fstar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: F* formal verification (full, including Double Ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Shared cache scope (`verify`) is reused by verify-proverif and
      # other verifier workflows so the expensive opam/F*/hax install
      # layers only need to be built once across jobs on a given branch.
      - name: Build verification image (GHA-cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: verification
          tags: signal-protocol-verify-runner:latest
          load: true
          cache-from: type=gha,scope=verify
          cache-to: type=gha,mode=max,scope=verify

      - name: Run F* verification inside container
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            signal-protocol-verify-runner:latest \
            bash -lc '
              # Hax-upstream is pinned via hax-upstream.commit at the
              # repo root. The CI clones that exact commit so a hax
              # release that breaks extraction does not silently land.
              if [ ! -d hax-upstream/hax-lib ]; then
                COMMIT="$(cat hax-upstream.commit | tr -d "[:space:]")"
                echo "Cloning hacspec/hax pinned to $COMMIT..."
                git clone https://github.com/hacspec/hax.git hax-upstream
                ( cd hax-upstream && git checkout --detach "$COMMIT" )
              fi
              eval "$(opam env)"
              # Full verification - includes Double_ratchet. The
              # plan replaces the previous --lite default; if the
              # full target hangs, the per-module timeout in the
              # Makefile bounds CI runtime.
              npm run verify:fstar
            '
