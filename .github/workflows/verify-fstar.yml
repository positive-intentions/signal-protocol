name: Verify F*

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: verify-fstar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: F* formal verification
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Shared cache scope (`verify`) is reused by the sibling verify-rocq,
      # verify-lean and verify-proverif workflows so the expensive
      # opam/F*/hax install layers only need to be built once across all
      # verifier workflows on a given branch.
      - name: Build verification image (GHA-cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: verification
          tags: signal-protocol-verify-runner:latest
          load: true
          cache-from: type=gha,scope=verify
          cache-to: type=gha,mode=max,scope=verify

      - name: Run F* verification inside container
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            signal-protocol-verify-runner:latest \
            bash -lc '
              if [ ! -d hax-upstream/hax-lib ]; then
                echo "Cloning hax-upstream (hacspec/hax) for proof libraries..."
                git clone --depth=1 https://github.com/hacspec/hax.git hax-upstream
              fi
              eval "$(opam env)"
              npm run verify:fstar:lite
            '
