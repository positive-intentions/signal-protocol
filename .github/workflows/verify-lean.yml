# EXPERIMENTAL: Lean/hax backend is not part of the primary verified claim
# (F* + ProVerif). This workflow is optional CI for contributors working on
# the classic extraction under signal-protocol-core/proofs/lean/.
# See signal-protocol-core/proofs/experimental/README.md.

name: "[experimental] Verify Lean"

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: verify-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lean (experimental, verify-lite)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build verification image (GHA-cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: verification
          tags: signal-protocol-verify-runner:latest
          load: true
          cache-from: type=gha,scope=verify
          cache-to: type=gha,mode=max,scope=verify

      - name: Run Lean verification inside container
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            signal-protocol-verify-runner:latest \
            bash -lc '
              if [ ! -d hax-upstream/hax-lib ]; then
                COMMIT="$(cat hax-upstream.commit | tr -d "[:space:]")"
                echo "Cloning hacspec/hax pinned to $COMMIT..."
                git clone https://github.com/hacspec/hax.git hax-upstream
                ( cd hax-upstream && git checkout --detach "$COMMIT" )
              fi
              eval "$(opam env)"
              npm run verify:lean:lite
            '
