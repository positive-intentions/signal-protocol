name: Verify F* (full)

on:
  push:
    branches: [feat/updating-testing-scripts]
  pull_request:
    branches: [feat/updating-testing-scripts]
  workflow_dispatch:

concurrency:
  group: verify-fstar-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: F* formal verification (full, includes Double Ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Reuses the same `verify` GHA cache scope as verify-fstar.yml and
      # other verifier workflows so the verification image layers stay warm.
      - name: Build verification image (GHA-cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: verification
          tags: signal-protocol-verify-runner:latest
          load: true
          cache-from: type=gha,scope=verify
          cache-to: type=gha,mode=max,scope=verify

      # F* + Z3 for Double_ratchet can exceed RAM on ubuntu-latest; exit 137 is typically OOM.
      - name: Enable swap (reduce OOM risk for F*)
        run: |
          sudo fallocate -l 16G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show
          free -h

      - name: Run F* full verification inside container
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            signal-protocol-verify-runner:latest \
            bash -lc '
              if [ ! -d hax-upstream/hax-lib ]; then
                echo "Cloning hax-upstream (hacspec/hax) for proof libraries..."
                git clone --depth=1 https://github.com/hacspec/hax.git hax-upstream
              fi
              eval "$(opam env)"
              npm run verify:fstar
            '
