name: Verify F* (full)

on:
  push:
    branches:
      - staging
      - feat/updating-testing-scripts
      - fix/formal-verification-for-f-star
  pull_request:
    branches:
      - staging
      - feat/updating-testing-scripts
      - fix/formal-verification-for-f-star
  workflow_dispatch:

concurrency:
  group: verify-fstar-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: F* formal verification (full, includes Double Ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Reuses the same `verify` GHA cache scope as verify-fstar.yml
      # and other verifier workflows so the verification image layers
      # stay warm.
      - name: Build verification image (GHA-cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: verification
          tags: signal-protocol-verify-runner:latest
          load: true
          cache-from: type=gha,scope=verify
          cache-to: type=gha,mode=max,scope=verify

      - name: Run F* full verification inside container
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            signal-protocol-verify-runner:latest \
            bash -lc '
              if [ ! -d hax-upstream/hax-lib ]; then
                COMMIT="$(cat hax-upstream.commit | tr -d "[:space:]")"
                echo "Cloning hacspec/hax pinned to $COMMIT..."
                git clone https://github.com/hacspec/hax.git hax-upstream
                ( cd hax-upstream && git checkout --detach "$COMMIT" )
              fi
              eval "$(opam env)"
              npm run verify:fstar
            '
