name: Verify Aeneas Rocq

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: verify-aeneas-rocq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Aeneas Rocq (Coq) formal verification
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build aeneas verification image (GHA-cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: aeneas-verification
          tags: signal-protocol-aeneas-verify-runner:latest
          load: true
          cache-from: type=gha,scope=aeneas-verify
          cache-to: type=gha,mode=max,scope=aeneas-verify

      - name: Run Aeneas Rocq verification inside container
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            signal-protocol-aeneas-verify-runner:latest \
            bash -lc '
              if [ ! -d aeneas-upstream/backends ]; then
                echo "Cloning aeneas-upstream (AeneasVerif/aeneas) for proof libraries...";
                git clone --depth=1 https://github.com/AeneasVerif/aeneas.git aeneas-upstream;
              fi;
              eval "$(opam env)";
              npm run verify:aeneas:rocq:abstract
            '
