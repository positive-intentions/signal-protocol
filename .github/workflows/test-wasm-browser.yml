name: Test WASM (Browser)

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: test-wasm-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: WASM tests (headless Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Headless Firefox is more reliable than Chrome+wasm-pack in some
      # environments (ChromeDriver killed / session 404). wasm-pack bundles
      # geckodriver; we only need a Firefox binary on PATH.
      - name: Install Firefox
        run: sudo apt-get update && sudo apt-get install -y firefox

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run wasm-pack browser tests
        run: npm run test:wasm
