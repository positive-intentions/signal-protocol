name: Verify ProVerif

on:
  push:
    branches:
      - staging
      - feat/updating-testing-scripts
      - fix/formal-verification-for-f-star
  pull_request:
    branches:
      - staging
      - feat/updating-testing-scripts
      - fix/formal-verification-for-f-star
  workflow_dispatch:

concurrency:
  group: verify-proverif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ProVerif protocol verification
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Shares the `verify` cache scope with verify-fstar/rocq/lean so
      # the underlying `formal-base` layers (opam, proverif, etc.) are
      # pulled from the shared cache rather than rebuilt.
      - name: Build ProVerif image (GHA-cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: proverif
          tags: signal-protocol-proverif:latest
          load: true
          cache-from: type=gha,scope=verify
          cache-to: type=gha,mode=max,scope=verify

      - name: Run ProVerif test suite
        run: |
          docker run --rm \
            -v "$PWD/formal-proofs:/app/formal-proofs" \
            -w /app/formal-proofs \
            signal-protocol-proverif:latest \
            ./test_proverif.sh
