[workspace]

[package]
name = "xeddsa-interop"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Dev-only XEdDSA interop tests (Signal XEdDSA crate + our core)"

[dependencies]
signal-protocol-core = { path = "../signal-protocol-core" }
xeddsa = { version = "1.1.0", features = ["xed25519"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
# Match xeddsa's rand_core 0.10 CryptoRng (rand 0.10).
rand = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "gen_vectors"
path = "src/bin/gen_vectors.rs"
