[package]
name = "signal-protocol-core"
version = "0.1.0"
edition = "2021"
description = "Signal Protocol core logic - no WASM, for formal verification with hax/F*"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["lib"]

[dependencies]
# Cryptography
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.8"
rand_core = "0.6"

# Error handling
thiserror = "1.0"

# Hex encoding (for non-sensitive data only)
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# hax formal verification - enable with: cargo build -p signal-protocol-core --features hax
# Then run: cargo hax into -i '-** +signal_protocol_core::double_ratchet::derive_message_key' fstar
hax-lib = { git = "https://github.com/hacspec/hax", optional = true }

[features]
default = []
hax = ["dep:hax-lib"]
