[package]
name = "signal-protocol-core"
version = "0.1.0"
edition = "2021"
description = "Signal Protocol core logic - no WASM, for formal verification with hax/F*"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["lib"]

[dependencies]
x25519-dalek = { version = "2.0", features = ["static_secrets"], optional = true }
ed25519-dalek = { version = "2.0", features = ["rand_core"], optional = true }
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
rand_core = "0.6"

thiserror = "1.0"

hex = "0.4"

serde = { version = "1.0", features = ["derive"] }

hax-lib = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(hax_compilation)"] }

[features]
default = ["crypto-backend"]
crypto-backend = ["dep:x25519-dalek", "dep:ed25519-dalek", "dep:aes-gcm", "dep:rand"]
