[workspace]
members = [".", "signal-protocol-core"]
exclude = ["signal-protocol-gallery"]
resolver = "2"

[package]
name = "signal-protocol-wasm"
version = "0.1.0"
edition = "2021"
description = "Signal Protocol implementation in Rust compiled to WebAssembly"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
signal-protocol-core = { path = "signal-protocol-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

# Real cryptography for production use
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
curve25519-dalek = "4.0"
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.8"
rand_core = "0.6"

# Constant-time operations for security
subtle = "2.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Error handling
thiserror = "1.0"

# Hex encoding (for non-sensitive data only)
hex = "0.4"

# Development dependencies for testing and coverage
[dev-dependencies]
wasm-bindgen-test = "0.3"

# Enable optimizations for WASM build
[profile.release]
opt-level = "s"  # Optimize for size
lto = true       # Enable link-time optimization
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-mutable-globals"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }